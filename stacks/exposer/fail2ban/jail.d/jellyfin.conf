[jellyfin]
enabled  = true
backend  = auto
filter   = jellyfin-caddy
logpath  = /var/log/caddy/jellyfin.log
maxretry = 5
findtime = 10m
bantime  = 1h
# Never ban ourselves / the LAN (Caddy arrives as 127.0.0.1; LAN clients are trusted).
ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
# Drop the offending IP on every port (box is public-facing).
action   = iptables-allports[name=jellyfin]
