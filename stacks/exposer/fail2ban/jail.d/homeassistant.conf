# Home Assistant is the highest-value target on this box — it controls physical
# devices — and it is protected by a single password with no second factor.
# So this jail is deliberately tighter than the others (they use 5 / 1h):
# 3 strikes and a 6 hour ban. Set maxretry=5 / bantime=1h to match the rest.
#
# HA rewrites home-assistant.log -> .log.1 on every restart, replacing the inode;
# fail2ban's auto backend follows that rotation.
[homeassistant]
enabled  = true
backend  = auto
filter   = homeassistant
logpath  = /var/log/homeassistant/home-assistant.log
maxretry = 3
findtime = 10m
bantime  = 6h
ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
action   = iptables-allports[name=homeassistant]
