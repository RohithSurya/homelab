# Bans IPs after repeated failed Jellyfin logins, read from Caddy's JSON access log for the
# Jellyfin vhost (since 2026-10-20 Jellyfin runs on the HP, so its own log isn't on this machine;
# Caddy is the internet-facing edge, so "client_ip" is the real client IP).
# A failed login is POST /Users/AuthenticateByName answered 401.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"method":"POST".*"uri":"/Users/AuthenticateByName[^"]*".*"status":401
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
