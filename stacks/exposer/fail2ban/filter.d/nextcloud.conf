# Official Nextcloud fail2ban filter (JSON nextcloud.log).
# Matches failed logins and trusted-domain probes; <HOST> = remoteAddr, which
# is the real client IP because TRUSTED_PROXIES=127.0.0.1 makes NC log X-Forwarded-For.
[Definition]
_groupsre = (?:(?:,?\s*"\w+":(?:"[^"]+"|\w+))*)
failregex = ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Login failed:
            ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Trusted domain error.
datepattern = ,?\s*"time"\s*:\s*"%%Y-%%m-%%d[T ]%%H:%%M:%%S(%%z)?"
