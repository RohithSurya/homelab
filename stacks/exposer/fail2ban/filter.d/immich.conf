# Bans IPs after repeated failed Immich logins.
# Immich has no clean file log, so we tail Caddy's JSON access log for the Immich
# vhost. Caddy is the internet-facing edge, so "client_ip" is the real client IP.
# A failed login is POST /api/auth/login returning 401.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"method":"POST".*"uri":"/api/auth/login".*"status":401
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
