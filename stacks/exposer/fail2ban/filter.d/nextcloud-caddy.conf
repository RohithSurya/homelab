# Bans IPs after repeated failed Nextcloud logins, read from Caddy's JSON access log for the
# Nextcloud vhost. (Since 2026-10-20 Nextcloud runs on the HP, so its own nextcloud.log is
# not on this machine; Caddy is the internet-facing edge, so "client_ip" is the real IP.)
#  - web login: POST /login answered 303 back to /login?...  (success goes elsewhere)
#  - WebDAV/OCS (sync + mobile apps): 401 although credentials WERE sent. A bare 401 without
#    an Authorization header is the normal first challenge of some clients, never counted.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"method":"POST".*"uri":"(?:/index\.php)?/login(?:\?[^"]*)?".*"status":303.*"Location":\["[^"]*/login\?
            ^.*"client_ip":"<HOST>".*"uri":"/(?:remote\.php|public\.php|ocs/v[12]\.php)/[^"]*".*"Authorization":\["REDACTED"\].*"status":401
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
