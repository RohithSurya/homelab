# Bans IPs after repeated failed Home Assistant logins.
#
# HA emits (homeassistant/components/http/ban.py):
#   Login attempt or request with invalid authentication from HOST (IP). Requested URL: 'URL'. (USER-AGENT)
# where HOST is a reverse-DNS lookup that MAY resolve to a hostname, so the first
# field is not reliably an IP. We key on the parenthesised address with <ADDR>,
# the same approach as jellyfin.conf.
#
# Two deliberate hardening choices, both about the trailing user-agent, which HA
# itself flags as unsanitised attacker-controlled input:
#   1. anchor on the [homeassistant.components.http.ban] logger tag, so a crafted
#      UA cannot fake an entire log line;
#   2. match the address non-greedily and require the literal ". Requested URL:"
#      immediately after it, so a UA containing something like "(8.8.8.8)." cannot
#      shift the capture onto an arbitrary IP and get a third party banned.
# Verified against all three cases with fail2ban-regex.
#
# Real client IPs only appear here because HA is configured with
# use_x_forwarded_for + trusted_proxies; without that every line reads 127.0.0.1.
[Definition]
failregex = ^.*\[homeassistant\.components\.http\.ban\] Login attempt or request with invalid authentication from .+? \(<ADDR>\)\. Requested URL:
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
