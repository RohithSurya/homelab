---
name: exposer
# The public edge for every self-hosted stack on this box.
#
# Owns host :80/:443, TLS (Let's Encrypt), dynamic DNS, and brute-force bans.
# Deliberately SEPARATE from the application stacks (../media-server, ../immich,
# ../next-cloud) so that restarting any one of them never takes the others — or
# TLS — offline, and so exposing a new service means adding a file to
# caddy/sites.d/ rather than editing an application's compose file.
#
# Caddy runs network_mode: host and proxies to backends on 127.0.0.1. This is not
# incidental: Jellyfin is host-net (LAN/DLNA discovery) and so can never join a
# user-defined bridge network. Loopback is the one model that works for all
# backends uniformly, and it keeps the application stacks unaware of this one.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Caddy: TLS terminator + reverse proxy ────────────────────────────────────
  # Vhosts live one-per-file in caddy/sites.d/ (imported by caddy/Caddyfile).
  # TLS: automatic Let's Encrypt. Port 80 is blocked by Comcast, so issuance
  # happens over TLS-ALPN-01 on :443 (Caddy falls back to it automatically).
  caddy:
    image: caddy:2.11.7                           # pinned: step versions deliberately (see ~/updater)
    container_name: caddy
    network_mode: host                           # reach every backend on 127.0.0.1; own host :80/:443
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
      # autoheal lives in the media-server stack but matches by LABEL across all
      # compose projects, so it still restarts this container when it goes unhealthy.
      - "autoheal=true"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites.d:/etc/caddy/sites.d:ro     # one .caddy file per exposed service
      - ./caddy/data:/data                        # Let's Encrypt certs + ACME account (KEEP: losing this re-issues)
      - ./caddy/config:/config                    # caddy's autosaved JSON config
      - ./caddy/logs:/var/log/caddy               # access logs (the fail2ban immich jail tails these)
    healthcheck:                                  # caddy admin API (localhost:2019) = process alive
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # Keeps rosurya.duckdns.org pointed at the current (dynamic) Comcast WAN IP.
  # Every vhost is a subdomain of it, so this is edge infrastructure, not app config.
  duckdns:
    image: lscr.io/linuxserver/duckdns:b9e2cafd-ls153   # pinned (lsio uses git-sha versions, not semver)
    labels:
      - 'wud.tag.include=^[0-9a-f]{8}-ls\d+$$'
      - 'wud.tag.transform=^[0-9a-f]{8}-ls(\d+)$$ => 0.0.$$1'
      - 'updater.policy=auto'
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - SUBDOMAINS=rosurya
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
    logging: *default-logging
    restart: unless-stopped

  # ── fail2ban: brute-force blocker for the public logins ──────────────────────
  # Runs in the host net ns with NET_ADMIN so its iptables bans take effect on the
  # host's INPUT chain, where inbound :443 actually lands.
  #
  # It reads logs from three different stacks. The Caddy access log is local (a
  # sibling directory); the Jellyfin and Nextcloud logs are absolute host paths
  # into the other stacks' state dirs. All three are read-only — this is the only
  # remaining coupling to the application stacks, and it is inherent to the job.
  fail2ban:
    container_name: fail2ban
    image: crazymax/fail2ban:1.1.1                # pinned
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=America/New_York
    volumes:
      - ./fail2ban:/data                                            # jail.d/ filter.d/ + f2b state db
      - ./caddy/logs:/var/log/caddy:ro                              # caddy access log (immich jail)
      # HA's whole config dir, read-only. Mounting just home-assistant.log does NOT
      # work: HA rotates it to .log.1 on every restart, replacing the inode, which
      # would pin a single-file bind mount to the stale one.
      - /home/rosurya/bedroom-agent/infra/home-automation/ha_config:/var/log/homeassistant:ro
    logging: *default-logging
    restart: unless-stopped

  # ── CrowdSec: behaviour detection + community IP blocklist ───────────────────
  # Complements fail2ban rather than replacing it: fail2ban bans on failed LOGINS
  # read from each app's own log; CrowdSec reads Caddy's access logs for scans,
  # probes and CVE attempts, and pulls the community blocklist of known-bad IPs.
  # This container only DECIDES. crowdsec-bouncer below is what drops packets.
  #
  # On a normal bridge network (it needs no host access). Its API is published on
  # loopback only so the host-net bouncer can reach it — on 8089, not the default
  # 8080, which zigbee2mqtt already owns.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1         # pinned
    container_name: crowdsec
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      - TZ=America/New_York
      - COLLECTIONS=crowdsecurity/caddy
      # Stop normal app traffic (404 bursts, long polls) reading as a scan.
      - PARSERS=crowdsecurity/jellyfin-whitelist crowdsecurity/nextcloud-whitelist
      - BOUNCER_KEY_firewall=${CROWDSEC_BOUNCER_KEY}
    volumes:
      - ./crowdsec/config:/etc/crowdsec                    # generated config + API credentials (gitignored)
      - ./crowdsec/data:/var/lib/crowdsec/data             # decisions db, hub data (gitignored)
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro      # which logs to read (tracked)
      - ./crowdsec/parsers/edge-apps-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/edge-apps-whitelist.yaml:ro
      - ./caddy/logs:/var/log/caddy:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # Enforces crowdsec's decisions: one ipset-backed DROP rule on the host's INPUT
  # chain, same reason as fail2ban for host net + NET_ADMIN. Built locally because
  # CrowdSec ships this bouncer as a release binary only (see the Dockerfile).
  # Stopping this container removes its rule and ipsets, i.e. unblocks everything.
  crowdsec-bouncer:
    build: ./crowdsec/bouncer
    image: crowdsec-firewall-bouncer-local:v0.0.36
    container_name: crowdsec-bouncer
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
    volumes:
      - ./crowdsec/bouncer/crowdsec-firewall-bouncer.yaml:/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml:ro
    depends_on:
      crowdsec:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── DIUN + autoheal for this machine (the Jetson) ─────────────────────────────
  # They lived in media-server until it moved to the HP (2026-10-20); the HP runs its own pair
  # from stacks/media-server. DIUN posts to NTFY_TOPIC_DIUN (its own topic, see media-server's
  # CLAUDE.md "ntfy: two topics"); autoheal restarts any container labelled autoheal=true.
  diun:
    image: crazymax/diun:4.33.0                  # pinned
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    container_name: diun
    command: serve
    group_add:
      - "${DOCKER_GID:-994}"                      # host 'docker' gid -> read /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun/data:/data                          # bolt db of seen image digests
    environment:
      - TZ=America/New_York
      - LOG_LEVEL=info
      - DIUN_WATCH_SCHEDULE=0 8 * * *              # check daily at 08:00
      - DIUN_WATCH_JITTER=30s
      - DIUN_WATCH_FIRSTCHECKNOTIF=false           # don't alert on the initial inventory
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true  # watch all containers, not just labelled ones
      - DIUN_NOTIF_NTFY_ENDPOINT=https://ntfy.sh
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC_DIUN}   # own topic, not the shared NTFY_TOPIC (see above)
      - DIUN_NOTIF_NTFY_PRIORITY=3                 # ntfy priority: 1=min .. 3=default .. 5=max
    logging: *default-logging
    restart: unless-stopped

  # autoheal — restarts any container that reports "unhealthy" (a hung-but-Up app that
  # `restart: unless-stopped` can't catch). SCOPED via label: only containers carrying
  # autoheal=true are watched. It matches by label ACROSS compose projects, so the set
  # spans stacks: jellyfin/media-bridge here, caddy in ../exposer, immich_server in
  # ../immich, app in ../next-cloud. The gluetun-netns stack is deliberately NOT
  # labelled — blind restarts there break the shared namespace.
  autoheal:
    # NOT pinned, deliberately: autoheal's newest version tag is 1.2.0 from 2021-07-08, while
    # :latest is still rebuilt (it moved as recently as 2026-09-12). Pinning would be a
    # five-year downgrade, so this is the one service with no version gate. Upstream CI
    # rebuilds :latest every midnight (fresh Alpine, no code change), so instead of a daily
    # Approve it auto-applies at most every 10 days (the interval replaces the semver gate).
    image: willfarrell/autoheal:latest
    labels:
      - 'wud.tag.include=^latest$$'
      - 'wud.watch.digest=true'
      - 'updater.policy=auto'
      - 'updater.min-interval=10d'
    container_name: autoheal
    environment:
      - TZ=America/New_York
      - AUTOHEAL_CONTAINER_LABEL=autoheal          # only watch containers labelled autoheal=true
      - AUTOHEAL_INTERVAL=15                        # check health every 15s
      - AUTOHEAL_START_PERIOD=60                    # give a fresh container 60s before acting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    restart: unless-stopped
