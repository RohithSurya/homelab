---
name: media-server   # pinned: container/volume names must not depend on the checkout folder
# Per-service log rotation (mirrors the global default in /etc/docker/daemon.json,
# but applies immediately to services that carry it, without a daemon restart).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gluetun:
    # Pinned to the last TAGGED RELEASE. gluetun's :latest is a rolling build that runs ahead
    # of releases (it was newer than v3.41.3 when this was pinned), which is the wrong trade
    # for the VPN kill switch every indexer-facing container depends on.
    # Updating this is never automatic: recreating gluetun makes a NEW container id, which
    # orphans the four netns dependents. They must be named in the SAME compose command:
    #   docker compose up -d --pull always gluetun prowlarr flaresolverr sonarr radarr
    image: qmcgaw/gluetun:v3.41.3
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Switzerland            # adjust to preferred country
      - FREE_ONLY=on                             # free Proton plan -> only free servers
      # Port forwarding is NOT available on the free plan; leave it off.
      # Allow LAN (10.0.0.0/24) and Tailscale (100.64.0.0/10) past the kill switch
      # so the web UIs stay reachable when the tunnel is up.
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24,100.64.0.0/10
      - DNS_ADDRESS=9.9.9.9
      - DNS_UPSTREAM_RESOLVERS=quad9,google
      - TZ=Etc/UTC
      # Built-in HTTP proxy (:8888) so off-VPN media-bridge can make plain requests from the VPN
      # exit IP (tamilmv crawler: TAMILMV_HTTP_PROXY=http://gluetun:8888). NOT published on the
      # host -- reachable only from docker networks via the `gluetun` hostname.
      - HTTPPROXY=on
    ports:
      - 9696:9696                                # prowlarr UI (moved here from prowlarr)
      - 8000:8000                                # gluetun control/health API
      - 8191:8191                                # flaresolverr (moved here from flaresolverr)
      - 8989:8989                                # sonarr (moved here from sonarr)
      - 7878:7878                                # radarr (moved here from radarr)
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls164   # pinned (see ~/updater)
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # 4-part lsio tags are not valid semver and wud mis-orders them (it offered
      # 4.0.9.2244-ls257 as newer than 4.0.19.2979-ls324). Reduce to 3-part semver.
      - 'wud.tag.transform=^(\d+)\.(\d+)\.(\d+)\.\d+-ls\d+$$ => $$1.$$2.$$3'
      - 'updater.policy=auto'
    container_name: prowlarr
    network_mode: "service:gluetun"              # all prowlarr traffic exits via the VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./prowlarr/config:/config                # prowlarr config persisted in-project
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2   # pinned
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - 'updater.policy=auto'
    container_name: flaresolverr
    network_mode: "service:gluetun"              # MUST share prowlarr's VPN exit IP
    environment:                                 # (cf_clearance cookies are IP-bound)
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325   # pinned
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # 4-part lsio tags are not valid semver and wud mis-orders them (it offered
      # 4.0.9.2244-ls257 as newer than 4.0.19.2979-ls324). Reduce to 3-part semver.
      - 'wud.tag.transform=^(\d+)\.(\d+)\.(\d+)\.\d+-ls\d+$$ => $$1.$$2.$$3'
      - 'updater.policy=approve'
    container_name: sonarr
    network_mode: "service:gluetun"              # behind VPN: shares FlareSolverr exit IP
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./sonarr/config:/config
      - ${DATA_ROOT:-./data}:/data               # single root -> hardlink imports
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls317   # pinned
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # 4-part lsio tags are not valid semver and wud mis-orders them (it offered
      # 4.0.9.2244-ls257 as newer than 4.0.19.2979-ls324). Reduce to 3-part semver.
      - 'wud.tag.transform=^(\d+)\.(\d+)\.(\d+)\.\d+-ls\d+$$ => $$1.$$2.$$3'
      - 'updater.policy=approve'
    container_name: radarr
    network_mode: "service:gluetun"              # behind VPN: shares FlareSolverr exit IP
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./radarr/config:/config
      - ${DATA_ROOT:-./data}:/data
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ── media-bridge: three custom services in one container ──────────────────────
  # seedr blackhole bridge + jellyfin-reaper + movierulz scraper/Torznab feed.
  # NOT behind the VPN (default bridge net) -> seedr's CDN downloads stay direct/fast.
  # Reaches *arr + FlareSolverr via the gluetun hostname (their ports are published on
  # gluetun); the movierulz crawler fetches the (CF-protected) site THROUGH FlareSolverr,
  # so this container itself never needs the VPN namespace. The Torznab feed is published
  # on the host (8002), so it is unaffected by the gluetun restart gotcha.
  media-bridge:
    build: ./media-bridge
    container_name: media-bridge
    user: "1000:1000"                            # write files as the *arr user for clean imports
    ports:
      # All interfaces, deliberately — the Jetson is dual-homed (Ethernet + Wi-Fi, both on
      # 10.0.0.0/24), so a literal LAN IP here (a) dies with its NIC, taking the seedr and
      # reaper threads down with it, and (b) races the DHCP lease at boot: docker.service
      # starts on network-online.target, which an interface can satisfy before its lease
      # exists. That exact pattern took Immich down for 10h on 2026-08-09.
      # The old "never 0.0.0.0" rationale did NOT hold: a router forward targets a LAN IP,
      # and these were bound to precisely that LAN IP, so the forward would have reached
      # them anyway. What keeps them off the internet is the router forwarding only 443.
      # These remain unauthenticated LAN control endpoints — do not forward any of them.
      - "8002:8002"                              # movierulz Torznab feed
      - "8003:8003"                              # youtube grabber web form
      - "8005:8005"                              # tamilmv Torznab feed
    environment:
      - TZ=America/New_York
      # --- blackhole bridge (bridge.py) + its download backends (backends/) ---
      # Which backend runs each blackhole drop, first match wins: <private|public|*>:<backend>.
      # e.g. private:seedbox,public:seedr. The *arr apps are unaffected by any choice here.
      # 2026-10-06: public moved to the seedbox too while Seedr's TLS certificate is expired (every
      # Seedr call fails verification). Public results are deleted from the box right after delivery.
      # Back to Seedr: private:seedbox,public:seedr
      - BRIDGE_ROUTE=private:seedbox,public:seedbox # 2026-09-25: private trackers -> Pulsed seedbox (per-tracker seed rules)
      # --- Seedr backend ---
      - SEEDR_EMAIL=${SEEDR_EMAIL}
      - SEEDR_PASSWORD_B64=${SEEDR_PASSWORD_B64}  # base64; '$' in pw breaks plain interpolation
      - POLL_INTERVAL=30
      - STALL_TIMEOUT=2700                          # 45 min, in seconds
      - SEED_HOLD=176400                            # 49h: private-tracker results stay on Seedr to seed (H&R rules)
      - SEEDR_FTP_HOST=ftps.seedr.cc                # FTP fallback for CDN-404'd files + byte resume; empty = off
      - SEEDR_FTP_PASSWORD_B64=${SEEDR_FTP_PASSWORD_B64:-}  # optional; unset = account password
      # --- private-tracker seed rules (hit-and-run); key = substring of the grab's indexer name.
      #     <hours>h = seed time required; <ratio>|<hours>h = whichever first. A drop whose rule
      #     exceeds its backend's cap (Seedr: 48h) waits in the blackhole instead of being sent.
      #     iptorrents is 48h only while the account is VIP (H&R-exempt until 2026-10-25): set it
      #     to 1.0|336h when VIP ends. private-default covers unknown trackers and stays strictest.
      - SEED_RULES=hd-space=48h,iptorrents=48h,torrenthaven=120h,retrotoon=72h,czteam=1.0|72h,private-default=336h
      # --- pulls home (puller.py): tuned SFTP (16 MiB window, 255 KiB requests, AES-GCM) fills the
      #     box's shared uplink (~40 MB/s evenings) with 1-2 streams per big file; small files (scene
      #     RAR volumes) go 4 at a time (11.7 -> 36.6 MB/s). Measured 2026-09-26. Never start a pull
      #     that would leave less than PULL_MIN_FREE_GB free here.
      - PULL_SEGMENTS=2
      - PULL_PARALLEL_FILES=4
      - SEEDBOX_SFTP_WINDOW_MB=16
      - PULL_MIN_FREE_GB=25
      # Pulls running at once: a small movie or a follow step no longer waits behind a 30 GB pull.
      # They share the box's uplink, so total speed is the same -- only who waits changes.
      - PULL_WORKERS=2
      # Follow mode (backends/follow.py): while a seedbox torrent downloads, copy its finished,
      # SHA-1-verified pieces home every FOLLOW_INTERVAL s, so the final pull only fetches the rest.
      # off|private|all; enabled 2026-10-16 for everything (public routes to the seedbox too now).
      - FOLLOW=all
      # --- retry rules (user decisions 2026-09-25). Both start in DRY-RUN: they only log what they
      #     would do (`python -m bridgelog` / events table) until switched to false after review.
      - SLOW_RULE=public                            # public|all|off: <5% after 2h, or projected ETA > 24h
      - SLOW_RULE_DRY_RUN=true
      - GIVE_UP_AFTER=10                            # failed attempts per movie/episode -> unmonitor + stop
      - GIVE_UP_DRY_RUN=true
      - FAILFAST=public                             # public|off: no metadata / 0 seeds after 10 min, nothing downloaded
      - FAILFAST_DRY_RUN=true
      # --- public torrents only: add ngosang/trackerslist's best ~20 trackers (daily, cached in config).
      #     NEVER applied to private torrents (would leak their infohash -> tracker ban).
      - PUBLIC_EXTRA_TRACKERS=on
      # --- seedbox backend (qBittorrent over SSH, backends/qbit.py). Secrets are NOT here: the SSH
      #     keys, qBittorrent password and pinned host key come from the vault (vault.py, token in
      #     media-bridge/config/bws_token). Only used once BRIDGE_ROUTE names "seedbox".
      - SEEDBOX_SSH_HOST=${SEEDBOX_SSH_HOST:-}
      - SEEDBOX_SSH_USER=${SEEDBOX_SSH_USER:-}
      - SEEDBOX_QBIT_USER=${SEEDBOX_QBIT_USER:-}
      - SEEDBOX_QUOTA_GB=230                        # fallback only; the real figure is read from ~/.quota
      - BWS_SERVER_URL=https://vault.bitwarden.com  # Bitwarden Secrets Manager, US region
      # --- shared *arr / jellyfin / ntfy ---
      - RADARR_URL=http://gluetun:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=http://gluetun:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - JELLYFIN_URL=http://host.docker.internal:8096   # jellyfin is host-net -> via host gateway
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}            # mint in Jellyfin UI: Dashboard -> API Keys
      - NTFY_SERVER=https://ntfy.sh
      - NTFY_TOPIC=${NTFY_TOPIC}
      # --- jellyfin-reaper ---
      - GRACE_DAYS=15                              # days after last watch before deleting
      - CHECK_INTERVAL=21600                       # 6 h between runs
      - MAX_DELETES_PER_RUN=5                      # blast-radius cap
      - DRY_RUN=false                              # LIVE: reaper actually deletes watched movies
      - JELLYFIN_USERS=rosurya                     # quorum excludes the passwordless guest user
      # --- movierulz scraper -> Torznab feed ---
      - MOVIERULZ_BASE=${MOVIERULZ_BASE}          # real site URL kept in .env, out of source
      - FLARESOLVERR_URL=http://gluetun:8191       # crawl CF-protected site via FlareSolverr
      - MOVIERULZ_APIKEY=${MOVIERULZ_APIKEY}       # also the Torznab apikey entered in Prowlarr
      - TORZNAB_PORT=8002
      - CRAWL_INTERVAL=3600
      # crawls the master /movies/page/N listing page 1 -> last page (covers every language + dubbed);
      # first pass backfills the whole catalogue, later passes stop early at the first all-known page.
      - MIN_PAGES=3
      - MAX_PAGES=1000                             # safety cap; real stop is the last/empty page (~407)
      - FAKE_SEEDERS=50                            # movierulz exposes no seeders; satisfy *arr minimums
      - REQUEST_DELAY=3
      # --- tamilmv scraper -> Torznab feed :8005 ---
      # Seeds + per-language forum maps come from a public GitHub data file (auto-tracks
      # domain rotation); live domain resolved by following the seed's 301 redirect. Pages, sitemap
      # and .torrent attachments go plain HTTP through gluetun's proxy (VPN exit IP); FlareSolverr
      # (FLARESOLVERR_URL) is the fallback on a CF challenge. Reuses FAKE_SEEDERS/REQUEST_DELAY above.
      - TAMILMV_HTTP_PROXY=http://gluetun:8888
      # Topic pages (every item's info link in Radarr/Sonarr, incl. '[DL-LINK]' direct links) use
      # the Tailscale address, so they open at home and away (Radarr is reached the same way).
      - TAMILMV_PUBLIC_URL=${TAMILMV_PUBLIC_URL:-http://100.122.87.20:8005}
      # Backfill: topics of a listing page fetched in parallel (measured: 1 -> 1.62 s/topic,
      # 3 -> 0.61, 4 -> 0.52 with request latency rising). Every topic problem -> JSONL log.
      - TAMILMV_BACKFILL_WORKERS=3
      - TAMILMV_ERRORS_LOG=/config/tamilmv_errors.jsonl
      - TAMILMV_CONFIG_URL=https://raw.githubusercontent.com/mhdzumair/MediaFusion/main/resources/json/scraper_config.json
      - TAMILMV_APIKEY=${TAMILMV_APIKEY}           # also the Torznab apikey entered in Prowlarr
      - TAMILMV_PORT=8005
      - TAMILMV_CONFIG_REFRESH=86400               # re-pull GitHub config daily
      - TAMILMV_CRAWL_INTERVAL=3600
      - TAMILMV_MAX_PAGES=5                         # head walk: newest pages per forum each pass
      # Dead-site ntfy at most weekly (default daily); a daily high-priority alert for a long outage
      # is just noise. Recovery is still immediate: a successful resolve resets the timer.
      - TAMILMV_DEAD_ALERT_INTERVAL=604800
      # Emergency override if the GitHub seed itself dies before upstream updates it:
      # - TAMILMV_SEED_OVERRIDE=https://www.1tamilmv.<tld>
      # --- youtube grabber (no-torrent fallback: pull a full-movie YouTube upload) ---
      - YOUTUBE_PORT=8003
      - DATA_HOST_PATH=${DATA_HOST_PATH:-/home/rosurya/media-server/data}  # HOST path of ./data; sibling yt-dlp containers bind-mount by host path
      # yt-dlp :latest is NOT self-updating (docker only fetches an absent image), and a stale
      # yt-dlp = every YouTube download dying with HTTP 403 partway in. Re-pull this often.
      - YTDLP_PULL_INTERVAL=21600
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./media-bridge/config:/config             # sqlite DB of scraped releases
      - /var/run/docker.sock:/var/run/docker.sock # spawn+remove disposable yt-dlp containers
    group_add:
      - "${DOCKER_GID:-994}"                      # host 'docker' group gid -> uid 1000 can use the socket
    extra_hosts:
      - "host.docker.internal:host-gateway"       # reach host-network Jellyfin (8096)
    labels:
      - 'wud.watch=false'
      - 'updater.policy=never'
      - "autoheal=true"                           # restart if the tamilmv Torznab server (healthcheck) hangs
      - "diun.enable=false"                        # locally-built image (no registry) -> skip update checks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/torznab/api?t=caps', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # ── home-egress: off-VPN HTTP proxy for IP-bound private-tracker sessions ─────────
  # KrazyZone binds its login cookie to the IP you logged in from (the home IPv4); from
  # the Proton exit IP it answers `Refresh: account-login.php` + deletes the cookie. So
  # Prowlarr reaches ONLY those sites through this proxy (Prowlarr → Settings → Indexers →
  # HTTP proxy 10.0.0.179:8006, tag `home-egress`, tag the indexer). Everything else stays
  # on the VPN. Destination allowlist in home-egress/filter; clients limited to docker
  # bridge sources (gluetun's netns), so LAN hosts can't use it. HTTP only — no BitTorrent.
  home-egress:
    build: ./home-egress
    container_name: home-egress
    ports:
      - "8006:8888"                              # all interfaces (see media-bridge); never forward
    volumes:
      - ./home-egress:/etc/tinyproxy:ro          # tinyproxy.conf + filter; edit then `docker restart home-egress`
    labels:
      - 'wud.watch=false'
      - 'updater.policy=never'
      - "diun.enable=false"                        # locally-built image (no registry)
    logging: *default-logging
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls368   # pinned
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+-ls\d+$$'
      - 'updater.policy=auto'
      - 'updater.max-bump=patch'
    container_name: bazarr
    network_mode: host                           # reaches sonarr/radarr on 127.0.0.1:8989/7878
    environment:                                 # (their ports are published on the host by gluetun)
      - PUID=1000                                # NOT behind VPN: subtitle providers don't need it
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./bazarr/config:/config
      - ${DATA_ROOT:-./data}:/data               # same root as sonarr/radarr -> 1:1 path mapping
    restart: unless-stopped

  # Official image (this install ran lscr.io/linuxserver/jellyfin until 2026-08-27).
  # The two images lay /config out differently, and 10.12+ hard-aborts on the
  # mismatch ("Expected to find only .jellyfin-data but found marker for
  # /config/.jellyfin-config"). The four JELLYFIN_*_DIR vars pin the official image
  # to the LinuxServer layout the existing data is already in — do NOT drop them.
  # Moving the data instead would mean relocating data/, metadata/, root/, plugins/
  # and every config XML, all of which are also referenced by absolute path in the DB.
  jellyfin:
    # Pinned to the immutable dated build, not the floating "12.0": 12.0's DB migrations are
    # one-way (see above), so a surprise move is the one thing to avoid here.
    image: jellyfin/jellyfin:12.2.20261005-225228
    container_name: jellyfin
    network_mode: host                           # LAN/DLNA discovery + reachable on Tailscale IP
    user: "1000:1000"                            # official image ignores PUID/PGID; keeps files owned by the *arr user
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d{8}-\d{6}$$'
      - 'wud.tag.transform=^(\d+)\.(\d+)\.(\d{8})-\d{6}$$ => $$1.$$2.$$3'
      - 'updater.policy=approve'
      - "autoheal=true"                           # restart if the /health check fails
    environment:
      - TZ=America/New_York
      - JELLYFIN_CONFIG_DIR=/config              # config XMLs sit at the root of /config
      - JELLYFIN_DATA_DIR=/config/data           # dbs, metadata, plugins, library root
      - JELLYFIN_CACHE_DIR=/config/cache         # official default is /cache, which is not mounted here
      - JELLYFIN_LOG_DIR=/config/log             # exposer's fail2ban tails this by absolute path
    volumes:
      - ./jellyfin/config:/config
      - ${DATA_ROOT:-./data}/media:/data/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # ── Public exposure lives in ../exposer ──────────────────────────────────────
  # Caddy (TLS + reverse proxy), DuckDNS and fail2ban were moved into their own
  # compose project at /home/rosurya/exposer so that this stack, ../immich and
  # ../next-cloud are independently restartable — `docker compose down` here no
  # longer takes TLS and the other services offline with it.
  #
  # Jellyfin needs no config here to be exposed: exposer's Caddy reaches it on
  # 127.0.0.1:8096 (it is network_mode: host), and exposer's fail2ban tails
  # ./jellyfin/config/log by absolute path. To change how Jellyfin is exposed,
  # edit ../exposer/caddy/sites.d/jellyfin.caddy.

  # DIUN — Docker Image Update Notifier (notify-only; replaces the archived Watchtower).
  # Watches EVERY container (safe: it never touches them) and pings ntfy when a new image
  # is published. You then update deliberately, so the gluetun-netns restart dance (see
  # CLAUDE.md) is never triggered unattended.
  # It posts to its OWN topic (NTFY_TOPIC_DIUN), NOT media-bridge's shared NTFY_TOPIC.
  # Sharing one topic hid these entirely: ntfy groups a topic's messages into a single
  # notification on the phone, so media-bridge's recurring operational alerts (a dead
  # scraper domain re-alerts every crawl pass) buried DIUN's once-daily batch. Keep them
  # split — the two feeds have completely different cadences and urgencies.
  diun:
    image: crazymax/diun:4.33.0                  # pinned
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    container_name: diun
    command: serve
    group_add:
      - "${DOCKER_GID:-994}"                      # host 'docker' gid -> read /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./diun/data:/data                          # bolt db of seen image digests
    environment:
      - TZ=America/New_York
      - LOG_LEVEL=info
      - DIUN_WATCH_SCHEDULE=0 8 * * *              # check daily at 08:00
      - DIUN_WATCH_JITTER=30s
      - DIUN_WATCH_FIRSTCHECKNOTIF=false           # don't alert on the initial inventory
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true  # watch all containers, not just labelled ones
      - DIUN_NOTIF_NTFY_ENDPOINT=https://ntfy.sh
      - DIUN_NOTIF_NTFY_TOPIC=${NTFY_TOPIC_DIUN}   # own topic, not the shared NTFY_TOPIC (see above)
      - DIUN_NOTIF_NTFY_PRIORITY=3                 # ntfy priority: 1=min .. 3=default .. 5=max
    logging: *default-logging
    restart: unless-stopped

  # autoheal — restarts any container that reports "unhealthy" (a hung-but-Up app that
  # `restart: unless-stopped` can't catch). SCOPED via label: only containers carrying
  # autoheal=true are watched. It matches by label ACROSS compose projects, so the set
  # spans stacks: jellyfin/media-bridge here, caddy in ../exposer, immich_server in
  # ../immich, app in ../next-cloud. The gluetun-netns stack is deliberately NOT
  # labelled — blind restarts there break the shared namespace.
  autoheal:
    # NOT pinned, deliberately: autoheal's newest version tag is 1.2.0 from 2021-07-08, while
    # :latest is still rebuilt (it moved as recently as 2026-09-12). Pinning would be a
    # five-year downgrade, so this is the one service with no version gate. Upstream CI
    # rebuilds :latest every midnight (fresh Alpine, no code change), so instead of a daily
    # Approve it auto-applies at most every 10 days (the interval replaces the semver gate).
    image: willfarrell/autoheal:latest
    labels:
      - 'wud.tag.include=^latest$$'
      - 'wud.watch.digest=true'
      - 'updater.policy=auto'
      - 'updater.min-interval=10d'
    container_name: autoheal
    environment:
      - TZ=America/New_York
      - AUTOHEAL_CONTAINER_LABEL=autoheal          # only watch containers labelled autoheal=true
      - AUTOHEAL_INTERVAL=15                        # check health every 15s
      - AUTOHEAL_START_PERIOD=60                    # give a fresh container 60s before acting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    restart: unless-stopped
