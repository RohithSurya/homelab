# Immich — self-hosted photo/video library (Google Photos alternative).
# Standalone stack (like ../next-cloud), separate from the media-server compose.
# Public reach is via the exposer Caddy on the Jetson (immich.rosurya.duckdns.org -> 10.0.0.64:2283
# since 2026-10-20, when Immich moved to the HP; compose.prod.yaml + env/prod.env hold the HP settings).
# The raw port is bound to loopback only (never 0.0.0.0), matching the media-bridge
# hardening convention, so it stays off the public internet even if the router forward changes.
#
# ML note: the immich-machine-learning image is multi-arch; on this Jetson (aarch64) it pulls
# the ARM64 CPU variant. Immich's CUDA-accelerated ML images are amd64-only, so Tegra uses CPU ML.

name: immich

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Loopback only. Caddy runs with network_mode: host, so it reaches this directly, and
      # both LAN and public clients arrive via immich.rosurya.duckdns.org.
      #
      # Do NOT re-add a literal LAN address (e.g. "10.0.0.179:2283:2283"). That IP is DHCP-assigned
      # over Wi-Fi (wlP1p1s0, "scope global dynamic"), and docker.service reaches network-online.target
      # before the lease exists, so the bind fails with "cannot assign requested address" and the
      # container never starts. That silently took Immich down for 10h after the 2026-08-09 reboot.
      # Loopback is always up before Docker starts, so this binding cannot lose that race.
      - "${IMMICH_BIND:-127.0.0.1}:2283:2283"   # prod: 0.0.0.0 (Caddy runs on the Jetson)
    depends_on:
      - redis
      - database
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
      - "autoheal=true"                            # media-server autoheal restarts it if unhealthy
    restart: unless-stopped
    healthcheck:
      disable: false
    logging: *default-logging

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - 'updater.policy=approve'
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false
    logging: *default-logging

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    labels:
      - 'wud.watch=false'
      - 'updater.policy=never'
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    logging: *default-logging

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    labels:
      - 'wud.watch=false'
      - 'updater.policy=never'
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    logging: *default-logging

volumes:
  model-cache:
