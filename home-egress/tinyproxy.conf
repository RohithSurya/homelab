# Off-VPN egress for the few indexers whose login session is bound to the home IP.
# Prowlarr (in gluetun's netns) uses this as an HTTP indexer proxy, tag `home-egress`.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 20
LogLevel Info

# Only other containers may use it: gluetun's netns reaches 10.0.0.179:8006 and
# arrives here from a docker bridge address. LAN clients keep their 10.0.0.x source
# and are refused, so this is not an open proxy on the LAN.
Allow 172.16.0.0/12

# Only the destinations listed in `filter`; everything else is denied.
# prowlarr.servarr.com is Prowlarr's proxy test/health-check URL (it refuses to save a proxy that fails it).
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/filter"
ConnectPort 443

DisableViaHeader Yes
