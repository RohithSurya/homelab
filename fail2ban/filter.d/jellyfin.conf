# Bans IPs after repeated failed Jellyfin logins.
# Real client IP appears only once Jellyfin "Known proxies" includes 127.0.0.1
# (so it trusts Caddy's X-Forwarded-For); otherwise every line shows 127.0.0.1.
[Definition]
failregex = ^.*Authentication request for .* has been denied \(IP: "<ADDR>"\)\.?\s*$
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S
