name: deploy
# Merge to main -> checks -> deploy every changed, enabled stack to its machine -> smoke checks
# -> automatic rollback on failure. ntfy reports either way.
# Manual run (Actions tab -> deploy -> Run workflow): one stack or all, dry run by default.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to deploy (media-server, immich, nextcloud, exposer) or all"
        default: all
      dry_run:
        description: "Dry run: copy, render, validate and build only -- start nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prod                 # never two deploys at once
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: test
    # Only merges/runs by the owner deploy (agents or other accounts can open PRs, never ship).
    if: github.actor == 'RohithSurya'
    runs-on: [self-hosted, jetson]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: clear the workspace as root
        # A `docker compose up` run inside the workspace leaves root-owned bind-mount folders that
        # checkout (uid 1000) can't delete -- every later run then fails at checkout (2026-10-22..27).
        run: docker run --rm --network none --entrypoint find -v "${GITHUB_WORKSPACE:?}:/w" homelab-runner:latest /w -mindepth 1 -delete
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        run: deploy/plan.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}" "${{ inputs.stack || 'all' }}" "${{ inputs.dry_run || false }}" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: deploy ${{ matrix.stack }} -> ${{ matrix.host }}
    runs-on: [self-hosted, "${{ matrix.host }}"]
    timeout-minutes: 60
    steps:
      - name: clear the workspace as root
        # A `docker compose up` run inside the workspace leaves root-owned bind-mount folders that
        # checkout (uid 1000) can't delete -- every later run then fails at checkout (2026-10-22..27).
        run: docker run --rm --network none --entrypoint find -v "${GITHUB_WORKSPACE:?}:/w" homelab-runner:latest /w -mindepth 1 -delete
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0      # rollback needs the previous commit
      - name: deploy
        # push: only stacks changed since their last good deploy; manual run: always (or dry run)
        run: deploy/deploy.sh "${{ matrix.stack }}" ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event_name == 'push' && '--if-changed' || '' }}
      - name: rollback
        id: rollback
        if: failure() && !inputs.dry_run
        run: deploy/rollback.sh "${{ matrix.stack }}"
      - name: notify
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout may be what failed: fetch lib.sh + envvault.py on their own so the alert still goes out
          [ -f deploy/lib.sh ] || { rm -rf "$RUNNER_TEMP/notify" &&
            git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/notify" &&
            cd "$RUNNER_TEMP/notify"; }
          . deploy/lib.sh
          sha=${GITHUB_SHA::7}
          case "${{ job.status }}/${{ steps.rollback.outcome }}" in
            success/*)        notify "deployed ${{ matrix.stack }}" "${{ matrix.stack }} @ $sha is live on ${{ matrix.host }}" ;;
            */success)        notify "ROLLED BACK ${{ matrix.stack }}" "${{ matrix.stack }} @ $sha failed its checks and was rolled back. Pre-deploy backup: $BACKUP_BASE/${{ matrix.stack }}/ . Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" high ;;
            *)                notify "DEPLOY FAILED ${{ matrix.stack }}" "${{ matrix.stack }} @ $sha failed and the rollback did not finish -- check now. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" urgent ;;
          esac
